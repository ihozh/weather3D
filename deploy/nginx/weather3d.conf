# weather3d nginx config
# - Serves the static frontend from /opt/weather3d
# - Serves processed HRRR data from /opt/weather3d/data/weather/hrrr
# - Exposes /api/* endpoints with permissive CORS (so the frontend can be
#   hosted elsewhere and still hit this VPS as a pure data backend)
#
# Replace `server_name _` and add an `ssl_certificate` block for production.

map $http_origin $cors_origin {
    default "*";
    "" "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/weather3d;
    index index.html;

    access_log /var/log/nginx/weather3d.access.log;
    error_log /var/log/nginx/weather3d.error.log;

    # Gzip everything text-ish; the large CSB geojson shrinks ~7x with it.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/geo+json
        application/javascript
        application/octet-stream
        text/css
        text/plain
        text/javascript;

    # Plain liveness probe (no CORS, no caching).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # JSON status: returns the current HRRR cycle manifest. Useful for
    # external monitors to detect stale data (compare cycle_utc vs now).
    location = /api/health {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        alias /opt/weather3d/data/weather/hrrr/latest.json;
    }

    # Public API: /api/hrrr/* maps 1:1 to the HRRR data directory.
    # The frontend hits these URLs when WEATHER3D_API_BASE points here.
    location /api/hrrr/ {
        alias /opt/weather3d/data/weather/hrrr/;
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # latest.json must never be cached (it's the manifest pointer).
        location = /api/hrrr/latest.json {
            alias /opt/weather3d/data/weather/hrrr/latest.json;
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin "$cors_origin" always;
        }
        # Per-cycle manifests also no-cache (small, often re-fetched).
        location ~ ^/api/hrrr/[0-9]+/manifest\.json$ {
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin "$cors_origin" always;
        }
        # Everything else (volumes, previews, npz) cached briefly.
        add_header Cache-Control "public, max-age=300";
    }

    # Vector data (CSB, water bodies, etc.)
    location /api/data/ {
        alias /opt/weather3d/data/;
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        if ($request_method = OPTIONS) {
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        add_header Cache-Control "public, max-age=3600";
    }

    # Legacy / same-origin static paths (kept for compatibility with the
    # frontend when it's hosted from the same VPS with default config).
    location = /data/weather/hrrr/latest.json {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        try_files $uri =404;
    }

    location ~ ^/data/weather/hrrr/[0-9]+/manifest\.json$ {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        try_files $uri =404;
    }

    location ~ ^/data/weather/hrrr/(volume|wind-volume)/ {
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        try_files $uri =404;
    }

    location ~ ^/data/.+\.(json|geojson|u8|f32|npz)$ {
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        try_files $uri =404;
    }

    # SPA / static fallback for the bundled frontend.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
